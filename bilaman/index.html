html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 75% 0,#2b1a7a 0,transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--tx);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}

nav{display:flex;align-items:center;gap:20px;height:76px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:.04em}
.logo svg{width:38px;height:38px}
.logo i{font-style:normal;color:var(--pu2)}
.links{display:flex;gap:6px;margin-left:24px;flex:1}
.links a{padding:10px 16px;border-radius:999px;font-size:15px;color:#e5e4ff}
.links a:hover,.links a.on{background:#4c1fd8}
.right{display:flex;gap:12px;align-items:center}
select{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:9px 12px}
select option{color:#111}
.btn{border-radius:999px;padding:12px 24px;border:1px solid var(--line);background:transparent;font-weight:600;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.pri{background:linear-gradient(90deg,#6d28d9,#8b5cf6);border-color:transparent;box-shadow:0 10px 30px rgba(124,58,237,.45)}
.burger{display:none}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;padding:50px 0 30px}
.badge{display:inline-block;padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px}
h1{font-size:clamp(40px,6vw,80px);line-height:1.02;margin:22px 0 10px;font-weight:800}
h1 em{font-style:normal;background:linear-gradient(90deg,#a855f7,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(22px,2.8vw,38px);font-weight:600;margin:0 0 18px}
.sub b{color:var(--pu2)}
.lead{color:var(--mu);max-width:480px;font-size:18px}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.vis{position:relative;min-height:460px;display:grid;place-items:center}
.brain{width:min(380px,80%);filter:drop-shadow(0 0 40px #5b6bff);animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
.chip{position:absolute;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:18px;padding:14px 18px;box-shadow:0 14px 40px rgba(0,0,0,.35);font-size:14px;animation:fl 7s ease-in-out infinite}
.chip b{display:block;font-size:24px}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#38bdf8)}
.c1{top:8%;left:0}.c2{bottom:22%;left:2%;animation-delay:1s}.c3{top:12%;right:0;animation-delay:2s}.c4{bottom:12%;right:0;animation-delay:3s;background:rgba(109,40,217,.55)}
.feats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:30px 0 70px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;gap:12px;align-items:center}
.feat span{font-size:30px}
.feat b{display:block}.feat small{color:var(--mu)}
section{padding:50px 0}
h2{font-size:clamp(28px,4vw,42px);margin:0 0 8px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.step{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
.step .n{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#3b82f6);display:grid;place-items:center;font-weight:800;margin-bottom:12px}
.demo{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;max-width:720px}
.prog{height:8px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-bottom:20px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c3aed,#38bdf8);transition:.3s}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.opt{padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:20px;font-weight:700}
.opt:hover{border-color:var(--pu2);background:rgba(124,58,237,.3)}
.note{color:var(--mu);font-size:14px;margin-top:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:10px;max-width:800px}
summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mu);font-size:14px;text-align:center}
dialog{background:#15114d;color:var(--tx);border:1px solid var(--line);border-radius:22px;padding:28px;width:min(400px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog input{width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--tx)}
.err{color:#fda4af;font-size:13px;min-height:18px}
:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
@media(max-width:1000px){.hero{grid-template-columns:1fr}.feats{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.links{display:none;position:absolute;top:76px;left:0;right:0;flex-direction:column;background:#0f0c3d;padding:12px;margin:0}.links.open{display:flex}.burger{display:block;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.right{margin-left:0}.vis{min-height:420px}}
@media(max-width:560px){.right .btn{display:none}.opts{grid-template-columns:1fr}.chip{font-size:12px;padding:10px}.feats{grid-template-columns:1fr}}
